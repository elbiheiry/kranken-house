<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="STMS login background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2c4d"/>
      <stop offset="55%" stop-color="#114b76"/>
      <stop offset="100%" stop-color="#1b7f9f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <circle cx="1320" cy="120" r="230" fill="#2dd4bf" fill-opacity="0.12"/>
  <circle cx="152" cy="870" r="280" fill="#60a5fa" fill-opacity="0.10"/>
  <circle cx="790" cy="500" r="420" fill="#ffffff" fill-opacity="0.03"/>

  <rect x="90" y="80" width="1240" height="300" rx="30" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.20"/>
  <text x="150" y="190" fill="#e2f3ff" font-family="Segoe UI, Tahoma, sans-serif" font-size="74" font-weight="700">STMS</text>
  <text x="150" y="255" fill="#d1ecff" font-family="Segoe UI, Tahoma, sans-serif" font-size="30" font-weight="500">Surgical Training Management System</text>
  <text x="150" y="302" fill="#b9ddf8" font-family="Segoe UI, Tahoma, sans-serif" font-size="22">Resident Progress  •  Case Logging  •  Procedure Mastery</text>

  <g fill="#c7ecff" fill-opacity="0.35">
    <rect x="1040" y="260" width="16" height="70" rx="8"/>
    <rect x="1013" y="287" width="70" height="16" rx="8"/>

    <rect x="1240" y="420" width="12" height="55" rx="6"/>
    <rect x="1218" y="442" width="55" height="12" rx="6"/>

    <rect x="280" y="520" width="14" height="64" rx="7"/>
    <rect x="255" y="545" width="64" height="14" rx="7"/>

    <rect x="420" y="760" width="12" height="55" rx="6"/>
    <rect x="399" y="781" width="55" height="12" rx="6"/>
  </g>

  <path d="M820 740 L900 740 L935 655 L985 810 L1038 700 L1090 740 L1210 740"
        fill="none" stroke="#b7efff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <g stroke="#d6f4ff" stroke-opacity="0.35" stroke-width="2">
    <line x1="0" y1="915" x2="1600" y2="915"/>
    <line x1="0" y1="860" x2="1600" y2="860"/>
    <line x1="0" y1="805" x2="1600" y2="805"/>
  </g>

  <g fill="#e5f8ff" fill-opacity="0.55" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="600">
    <text x="1120" y="300">Training Identity</text>
    <text x="1110" y="330">Safety • Competency • Progress</text>
